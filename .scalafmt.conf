version = 3.11.5
runner.dialect = scala3
maxColumn = 110

// The house style is braceless Scala. This rule turns every optional-braces region
// (template blocks, `test("...") { }`, `{ x => ... }` lambdas) into significant
// indentation, old syntax included, so `sbt compile` is the enforcement.
rewrite.scala3.optionalBraces {
  enabled = true
  oldSyntaxToo = true
  fewerBraces {
    span.max = 10000
    parensToo = false
  }
}

rewrite.redundantBraces.stringInterpolation = true

fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
}
